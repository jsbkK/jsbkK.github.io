<!doctype html>
<!--
  独立加载页：/loading.html
  用途：页面跳转中转 / 加载态展示，风格与本站（白粥游戏测评）一致。
  - 零外部资源、零 JS 依赖（仅一段可选的跳转逻辑，见底部注释）。
  - 遵循本站设计令牌：用线不用阴影、单色暖橙红、衬线标题、极简暗色 + 系统浅色自适应。
  - 只用具体色值，不用 CSS 颜色混合函数（兼容 safari15/ios15）；支持 prefers-reduced-motion。
  - 不接入全站、不影响其它页面：这是 public/ 下的独立静态文件。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>加载中 · 白粥游戏测评</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0c;
      --surface: #121215;
      --text: #ededf0;
      --text-2: #a0a0a8;
      --line: #23232a;
      --line-strong: #2e2e38;
      --accent: #ff5630;
      --accent-dim: rgba(255, 86, 48, 0.12);
      --accent-fg: #0a0a0c;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      --font-num: 'Orbitron', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --font-display: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', STSongti, SimSun, Georgia, serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #fafafb;
        --surface: #ffffff;
        --text: #18181b;
        --text-2: #52525b;
        --line: #d4d4d8;
        --line-strong: #a1a1aa;
        --accent: #c2410c;
        --accent-dim: rgba(194, 65, 12, 0.1);
        --accent-fg: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .loader {
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: fade 400ms var(--ease) both;
    }
    /* 品牌标识：与站点 header 的 BAIZHOU / 白粥游戏测评 一致 */
    .brand { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; }
    .brand__text {
      font-family: var(--font-num);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: var(--text);
      padding-left: 0.32em;
    }
    .brand__sub { font-size: 12px; letter-spacing: 0.12em; color: var(--text-2); }
    .rule {
      width: 40px;
      height: 1px;
      background: var(--line-strong);
      margin: 28px auto;
    }
    /* 加载指示：用线不用阴影，单色强调 */
    .bar {
      position: relative;
      width: 100%;
      height: 2px;
      background: var(--line);
      overflow: hidden;
    }
    .bar__fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 40%;
      background: var(--accent);
      animation: sweep 1.15s var(--ease) infinite;
    }
    .status {
      margin-top: 18px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--text-2);
    }
    .status .num { font-family: var(--font-num); color: var(--accent); }
    .hint {
      margin-top: 40px;
      font-size: 12px;
      color: var(--text-2);
    }
    .hint a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--line-strong);
      padding-bottom: 2px;
      transition: color 160ms var(--ease), border-color 160ms var(--ease);
    }
    .hint a:hover { color: var(--accent); border-color: var(--accent); }
    @keyframes sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .loader { animation: none; }
      .bar__fill { width: 100%; animation: none; }
    }
  </style>
</head>
<body>
  <main class="loader" role="status" aria-live="polite">
    <div class="brand">
      <span class="brand__text">BAIZHOU</span>
      <span class="brand__sub">白粥游戏测评</span>
    </div>
    <div class="rule" aria-hidden="true"></div>
    <div class="bar" aria-hidden="true"><span class="bar__fill"></span></div>
    <p class="status">正在为你加载<span class="num">…</span></p>
    <p class="hint">加载有点慢？<a href="/">返回首页</a></p>
  </main>
  <!--
    如需用作跳转中转，在下方加一段内联脚本即可（本页无 CSP 限制）：
    <script>
      var p = new URLSearchParams(location.search).get('to') || '/';
      if (/^\/(?!\/)/.test(p)) setTimeout(function(){ location.replace(p); }, 800);
    </script>
    仅允许站内相对路径（以单个 / 开头），避免开放重定向。当前未启用跳转，纯展示。
  -->
</body>
</html>
